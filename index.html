<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockroom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Stockroom</h1>
      <p id="summary" aria-live="polite"></p>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search items" aria-label="Search items">
      <select id="status" aria-label="Filter by stock level">
        <option value="all">All items</option>
        <option value="low">Needs reorder</option>
        <option value="out">Out of stock</option>
      </select>
      <button id="add" class="primary">Add item</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Item</th><th>Category</th><th>Stock level</th><th class="num">Price</th><th><span class="sr">Actions</span></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" hidden>No items match. Clear the search or add a new item.</p>

    <footer><button id="reset" class="link">Reset demo data</button></footer>
  </main>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2>Add item</h2>
      <label>Name <input name="name" required></label>
      <label>Category <input name="category" required></label>
      <label>Quantity <input name="qty" type="number" min="0" value="0" required></label>
      <label>Reorder when at or below <input name="reorder" type="number" min="0" value="5" required></label>
      <label>Price <input name="price" type="number" min="0" step="0.01" value="0" required></label>
      <div class="form-actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save item</button>
      </div>
    </form>
  </dialog>

  <script src="repository.js"></script>
  <script src="app.js"></script>
</body>
</html>
